[package]
name = "launchpad"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2"] }
tray-icon = "0.21.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }

[build-dependencies]
slint-build = "1"

[dev-dependencies]
tempfile = "3"
